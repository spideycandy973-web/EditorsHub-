name: Build Android (EditorsHub)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/9b71f21a-editorshub
    paths:
      - 'EditorsHub/**'
      - 'ci/smoke.sh'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build, test and package
        run: |
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee ../android-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          cp android-build.log ci-logs/android-build.log 2>/dev/null || true
          git add -f ci-logs/ || true
          git commit -m "ci: android build diagnostics [skip ci]" || echo "no diagnostic changes"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:arena/9b71f21a-editorshub; then pushed=1; break; fi
            echo "push attempt $attempt failed; retrying"
            sleep 10
            git fetch origin arena/9b71f21a-editorshub
            git pull origin arena/9b71f21a-editorshub --no-rebase || true
          done
          [ "$pushed" = "1" ] || true

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp EditorsHub/app/build/outputs/apk/debug/app-debug.apk artifacts/EditorsHub-debug.apk
          cp EditorsHub/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/EditorsHub-release-unsigned.apk
          cp EditorsHub/app/build/outputs/bundle/release/app-release.aab artifacts/EditorsHub-release.aab
          ls -lh artifacts

      - name: Package complete source archive
        if: success()
        # Source only: exclude committed build outputs so the ZIP stays small.
        run: |
          git archive --format=zip --prefix=EditorsHub-v3.2.0/ HEAD -- \
            . ':(exclude)artifacts' ':(exclude)artifacts/**' \
            ':(exclude)EditorsHub-Motion.apk' ':(exclude)ci-logs' > artifacts/EditorsHub-source-v3.2.0.zip
          ls -lh artifacts/

      - name: Upload artifact bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android
          path: artifacts/
          if-no-files-found: error

      - name: Publish latest automated build
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editorshub-latest
          name: EditorsHub — Android builds
          body: |
            Automated build from the native Android Studio project (`EditorsHub/`).
            `EditorsHub-debug.apk` is installable for development.
            The release APK/AAB are unsigned by design — see docs/RELEASE_SIGNING.md.
          files: |
            artifacts/EditorsHub-debug.apk
            artifacts/EditorsHub-release-unsigned.apk
            artifacts/EditorsHub-release.aab
            artifacts/EditorsHub-source-v3.2.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release v3.2.0
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: EditorsHub v3.2.0 — responsive, fully wired editor
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/EditorsHub-debug.apk
            artifacts/EditorsHub-release-unsigned.apk
            artifacts/EditorsHub-release.aab
            artifacts/EditorsHub-source-v3.2.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit artifacts to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/
          git commit -m "build: add Android APK + AAB [skip ci]" || echo "artifacts already committed"
          # The Capacitor APK workflow may have pushed to this branch in parallel.
          git fetch origin arena/9b71f21a-editorshub
          git pull origin arena/9b71f21a-editorshub --no-rebase || true
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:arena/9b71f21a-editorshub; then pushed=1; break; fi
            echo "push attempt $attempt failed; retrying"
            sleep 10
            git fetch origin arena/9b71f21a-editorshub
            git pull origin arena/9b71f21a-editorshub --no-rebase || true
          done
          [ "$pushed" = "1" ]

  # Verifies the debug APK actually launches on a real Android system image.
  # Verifies the v2.0.0 launch-crash fix still holds after every UI change.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout for diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # The action runs each line with its own `sh -c`, so use a script file.
          script: sh ci/smoke.sh

      - name: Publish smoke diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          if [ -f smoke-diagnostics.txt ]; then
            cp smoke-diagnostics.txt ci-logs/smoke-diagnostics.txt
          else
            echo "no diagnostics file was produced" > ci-logs/smoke-diagnostics.txt
          fi
          git fetch origin arena/9b71f21a-editorshub
          git reset --hard origin/arena/9b71f21a-editorshub
          git add -f ci-logs/
          git commit -m "ci: smoke diagnostics [skip ci]" || echo "no diagnostic changes"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:arena/9b71f21a-editorshub; then pushed=1; break; fi
            echo "push attempt $attempt failed; retrying"
            sleep 10
            git fetch origin arena/9b71f21a-editorshub
            git pull origin arena/9b71f21a-editorshub --no-rebase || true
          done
          [ "$pushed" = "1" ] || true
