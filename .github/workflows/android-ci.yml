name: Build Android (EditorsHub)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/be31b8e1-editorshub
    paths:
      - 'EditorsHub/**'
      - 'ci/smoke.sh'
      - 'ci/android-smoke.sh'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build, test and package
        run: |
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee ../android-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-build.log
          if-no-files-found: ignore

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp EditorsHub/app/build/outputs/apk/debug/app-debug.apk artifacts/EditorsHub-debug.apk
          cp EditorsHub/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/EditorsHub-release-unsigned.apk
          cp EditorsHub/app/build/outputs/bundle/release/app-release.aab artifacts/EditorsHub-release.aab
          ls -lh artifacts

      - name: Package complete source archive
        if: success()
        # Source only: exclude committed build outputs so the ZIP stays small.
        run: |
          git archive --format=zip --prefix=EditorsHub-v4.5.0/ HEAD -- \
            . ':(exclude)artifacts' ':(exclude)artifacts/**' \
            ':(exclude)EditorsHub-Motion.apk' ':(exclude)ci-logs' > artifacts/EditorsHub-source-v4.5.0.zip
          ls -lh artifacts/

      - name: Upload artifact bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android
          path: artifacts/
          if-no-files-found: error

  # Verifies the debug APK actually launches on a real Android system image.
  # Verifies the v2.0.0 launch-crash fix still holds after every UI change.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout for diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # The script logs instrumentation output and then installs/launches the packaged APK.
          script: sh ci/android-smoke.sh

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            android-test.log
            smoke-diagnostics.txt
          if-no-files-found: ignore
