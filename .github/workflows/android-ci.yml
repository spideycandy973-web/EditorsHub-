name: Build Android (EditorsHub)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/fa6652a1-editorshub
    paths:
      - 'EditorsHub/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build, test and package
        run: |
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee ../android-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          cp android-build.log ci-logs/android-build.log 2>/dev/null || true
          git add -f ci-logs/ || true
          git commit -m "ci: android build diagnostics [skip ci]" || echo "no diagnostic changes"
          git push origin HEAD:arena/fa6652a1-editorshub || true

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp EditorsHub/app/build/outputs/apk/debug/app-debug.apk artifacts/EditorsHub-debug.apk
          cp EditorsHub/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/EditorsHub-release-unsigned.apk
          cp EditorsHub/app/build/outputs/bundle/release/app-release.aab artifacts/EditorsHub-release.aab
          ls -lh artifacts

      - name: Package complete source archive
        if: success()
        run: |
          git archive --format=zip --prefix=EditorsHub-v2.0.1/ HEAD > artifacts/EditorsHub-source-v2.0.1.zip
          ls -lh artifacts/

      - name: Upload artifact bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android
          path: artifacts/
          if-no-files-found: error

      - name: Publish latest automated build
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editorshub-latest
          name: EditorsHub — Android builds
          body: |
            Automated build from the native Android Studio project (`EditorsHub/`).
            `EditorsHub-debug.apk` is installable for development.
            The release APK/AAB are unsigned by design — see docs/RELEASE_SIGNING.md.
          files: |
            artifacts/EditorsHub-debug.apk
            artifacts/EditorsHub-release-unsigned.apk
            artifacts/EditorsHub-release.aab
            artifacts/EditorsHub-source-v2.0.1.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release v2.0.1
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: EditorsHub v2.0.1 — Professional Motion Editor
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/EditorsHub-debug.apk
            artifacts/EditorsHub-release-unsigned.apk
            artifacts/EditorsHub-release.aab
            artifacts/EditorsHub-source-v2.0.1.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit artifacts to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/
          git commit -m "build: add Android APK + AAB [skip ci]" || echo "artifacts already committed"
          git push origin HEAD:arena/fa6652a1-editorshub

  # Verifies the debug APK actually launches on a real Android system image.
  # The v2.0.0 crash was a startup-only failure that unit tests could not catch.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r artifacts/EditorsHub-debug.apk
            adb logcat -c
            adb shell am start -W -n com.editorshub/.MainActivity
            sleep 12
            PROC=$(adb shell pidof com.editorshub || true)
            if [ -z "$PROC" ]; then
              echo "::error::EditorsHub process is not running after launch"
              adb logcat -d -v brief | tail -120
              exit 1
            fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::Crash detected in logcat"
              adb logcat -d -v brief | tail -160
              exit 1
            fi
            echo "Launch smoke test passed (pid $PROC)"
