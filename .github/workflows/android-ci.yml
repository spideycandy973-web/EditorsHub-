name: Build Android (EditorsHub)

on:
  workflow_dispatch:
    inputs:
      publish_debug_prerelease:
        description: Publish this tested debug APK as a clearly labeled pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - arena/be31b8e1-editorshub
    paths:
      - 'EditorsHub/**'
      - 'ci/smoke.sh'
      - 'ci/android-smoke.sh'
      - 'ci/capture-native-states.py'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build, test and package
        run: |
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee ../android-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-build.log
          if-no-files-found: ignore

      - name: Surface Gradle errors in check annotations
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('android-build.log')) {
              core.error('Gradle build failed before the diagnostic log was created.');
              return;
            }
            const lines = fs.readFileSync('android-build.log', 'utf8').split(/\r?\n/);
            const matches = lines.filter(line =>
              /^(e:|w:|FAILURE:|\* What went wrong|Execution failed|.*Unresolved reference|.*Type mismatch|.*Overload resolution ambiguity|.*No value passed|.*Cannot infer)/i.test(line)
            ).slice(-80);
            const detail = matches.length ? matches.join('\n') : lines.slice(-100).join('\n');
            core.error(`Gradle failure details:\n${detail}`.slice(0, 9000));

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp EditorsHub/app/build/outputs/apk/debug/app-debug.apk artifacts/EditorsHub-debug.apk
          cp EditorsHub/app/build/outputs/apk/release/app-release.apk artifacts/EditorsHub-release.apk
          cp EditorsHub/app/build/outputs/bundle/release/app-release.aab artifacts/EditorsHub-release.aab
          ls -lh artifacts

      - name: Package complete source archive
        if: success()
        # Source only: exclude committed build outputs so the ZIP stays small.
        run: |
          git archive --format=zip --prefix=EditorsHub-v4.5.2/ HEAD -- \
            . ':(exclude)artifacts' ':(exclude)artifacts/**' \
            ':(exclude)EditorsHub-Motion.apk' ':(exclude)ci-logs' > artifacts/EditorsHub-source-v4.5.2.zip
          ls -lh artifacts/

      - name: Upload artifact bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android
          path: artifacts/
          if-no-files-found: error

  # Verifies the debug APK actually launches on a real Android system image.
  # Verifies the v2.0.0 launch-crash fix still holds after every UI change.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout for diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # The script logs instrumentation output and then installs/launches the packaged APK.
          script: sh ci/android-smoke.sh

      - name: Upload native UI state captures for visual QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-native-home-capture
          path: |
            native-home.png
            native-projects.png
            native-create.png
            native-editor.png
            native-editor-add.png
            native-editor-inspector.png
            native-editor-properties.png
            native-editor-transform.png
            native-editor-keyframe.png
          if-no-files-found: warn

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            android-test.log
            smoke-diagnostics.txt
          if-no-files-found: ignore

      - name: Save emulator failure details for diagnosis
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sections = [`Workflow run ${context.runId}`];
            for (const [path, label, lines] of [
              ['android-test.log', 'instrumentation', 500],
              ['smoke-diagnostics.txt', 'launch smoke', 160],
            ]) {
              if (fs.existsSync(path)) {
                const text = fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-lines).join('\n');
                sections.push(`--- ${label} ---`, text);
              }
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `ci-logs/android-emulator-debug-${context.runId}.txt`,
              message: `ci: capture Android emulator failure ${context.runId} [skip ci]`,
              content: Buffer.from(sections.join('\n\n'), 'utf8').toString('base64'),
              branch: 'arena/be31b8e1-editorshub',
            });

  # Optional, explicitly labeled debug pre-release. A stable signed release still
  # goes through android-release.yml and its production signing secrets.
  publish-debug-prerelease:
    name: Publish tested debug pre-release
    needs: [build, smoke]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_debug_prerelease) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-debug-prerelease]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          path: release-assets

      - name: Verify release asset
        run: |
          test -s release-assets/EditorsHub-debug.apk
          sha256sum release-assets/EditorsHub-debug.apk

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5.2-debug
          target_commitish: ${{ github.sha }}
          name: EditorsHub v4.5.2 — Debug pre-release
          prerelease: true
          body: |
            **Tested debug-signed build — not the official production-signed release.**

            Built from commit `${{ github.sha }}` after the Android build, instrumentation tests, and emulator install/launch smoke check passed.

            **Install/update notice:** This APK uses a CI debug signing key. Android may refuse to update an existing installation signed with a different key. Back up projects before uninstalling. This pre-release does not replace the stable v4.5.2 release.
          files: release-assets/EditorsHub-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
