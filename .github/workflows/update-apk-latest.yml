name: Update rolling apk-latest release

on:
  push:
    branches:
      - arena/be31b8e1-editorshub
    paths:
      - '.github/workflows/update-apk-latest.yml'
      - '.github/release-notes/apk-latest.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: update-apk-latest
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'spideycandy973-web/EditorsHub-' && contains(github.event.head_commit.message, '[update-apk-latest]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: apk-latest
      TITLE: EditorsHub — Android APK
      RELEASE_COMMIT: 97702d00b71d5fc7b3bad716286477ea356bacd7
      SOURCE_RUN_ID: '42677408773'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rebuilt native Android artifact
        uses: actions/download-artifact@v4
        with:
          name: editorshub-android
          run-id: 42677408773
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Verify APK version and prepare rolling assets
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          test -s release-assets/EditorsHub-debug.apk
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging release-assets/EditorsHub-debug.apk | tee apk-badging.txt
          grep -q "versionName='4.4.0'" apk-badging.txt
          grep -q "versionCode='20'" apk-badging.txt
          cp release-assets/EditorsHub-debug.apk release-assets/EditorsHub-Motion.apk
          head -1 apk-badging.txt > release-assets/APK_BADGING.txt
          (cd release-assets && sha256sum EditorsHub-Motion.apk APK_BADGING.txt > SHA256SUMS.txt)
          cp .github/release-notes/apk-latest.md release-notes.md
          {
            echo
            echo "Source CI run: ${SOURCE_RUN_ID}"
            echo
            echo "Release commit: \`${RELEASE_COMMIT}\`"
            echo
            echo '## APK manifest'
            echo
            echo '```text'
            cat release-assets/APK_BADGING.txt
            echo '```'
            echo
            echo '## Checksums'
            echo
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } >> release-notes.md
          ls -lh release-assets

      - name: Retag and update rolling release
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" \
            -f sha="$RELEASE_COMMIT" -F force=true >/dev/null
          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq .id)
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -f target_commitish="$RELEASE_COMMIT" >/dev/null
          gh release edit "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
          gh release upload "$TAG" \
            release-assets/EditorsHub-Motion.apk \
            release-assets/APK_BADGING.txt \
            release-assets/SHA256SUMS.txt \
            --clobber
          gh release view "$TAG" --json name,tagName,targetCommitish,url,isDraft,isPrerelease,assets
