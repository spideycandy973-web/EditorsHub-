name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify the signed APK without publishing a release'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # These are not secrets: the keystore is committed and public.
      KEYSTORE_PASSWORD: editorshub
      KEY_ALIAS: editorshub
      KEY_PASSWORD: editorshub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="EditorsHub/app/build.gradle.kts"
          APP_VERSION=$(sed -n -E 's/.*(val appVersionName|versionName)[[:space:]]*=[[:space:]]*"([^"]+)".*/\2/p' "$GRADLE_FILE" | head -1)
          APP_VERSION_CODE=$(sed -n -E 's/.*(val appVersionCode|versionCode)[[:space:]]*=[[:space:]]*([0-9]+).*/\2/p' "$GRADLE_FILE" | head -1)
          test -n "$APP_VERSION"
          test -n "$APP_VERSION_CODE"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must be vMAJOR.MINOR.PATCH"
              exit 1
            fi
            if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION does not match appVersionName $APP_VERSION"
              exit 1
            fi
            ASSET_TAG="$GITHUB_REF_NAME"
            VERSION="$TAG_VERSION"
          else
            ASSET_TAG="nightly"
            VERSION="$APP_VERSION"
          fi
          echo "asset_tag=$ASSET_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (code $APP_VERSION_CODE); asset tag: $ASSET_TAG"

      - name: Verify committed keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/keystore/editorshub.p12"
          test -s "$KEYSTORE"
          sha256sum "$KEYSTORE"
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="EditorsHub/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Signed release APK was not produced"
            ls -la EditorsHub/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.editorshub'" badging.txt
          grep -q "versionName='${{ steps.version.outputs.version }}'" badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" badging.txt
          mkdir -p dist
          cp "$APK" "dist/EditorsHub-${{ steps.version.outputs.asset_tag }}.apk"
          sha256sum dist/*.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: EditorsHub — latest build
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: echo "Signed release APK built and verified; no release was published."
