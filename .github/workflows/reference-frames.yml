name: Extract reference recording storyboard

# The 10:29.66 / 301,626,146-byte screen recording in Google Drive is larger
# than the agent workspace's 100 MiB per-file transfer limit. GitHub Actions has
# full network access, so it downloads the recording from the public Drive link,
# turns it into compact frames/storyboards, and commits ONLY those small files
# back to this branch. The raw MP4 never enters the repository.
#
# This workflow also imports the small native-home capture artifact from the
# Android CI run so the current Compose UI can be compared with the reference
# stills in the agent workspace.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/be31b8e1-editorshub
    paths:
      - '.github/workflows/reference-frames.yml'
      - 'tools/reference-frames-trigger.txt'

permissions:
  actions: read
  contents: write

concurrency:
  group: reference-frames-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[import-visual-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: arena/be31b8e1-editorshub
      DRIVE_ID: 1Wqk73fNhe1NqiwwlQC53fjLgZZXtTzq6
      CAPTURE_RUN_ID: '42889182326'
      CAPTURE_ARTIFACT: editorshub-native-home-capture
      NATIVE_CAPTURE: docs/screenshots/native-home-v4.5.2.png
      STORYBOARD_OUT: docs/reference-frames
      KEY_TIMES: '5,18,30,60,100,390,570,625'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --disable-pip-version-check gdown
          ffmpeg -version | head -1

      - name: Import native home capture artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/native-capture
          mkdir -p /tmp/native-capture
          gh run download "$CAPTURE_RUN_ID" -n "$CAPTURE_ARTIFACT" -D /tmp/native-capture
          find /tmp/native-capture -type f -printf '%p %s bytes\n'
          test -s /tmp/native-capture/native-home.png
          mkdir -p docs/screenshots
          cp /tmp/native-capture/native-home.png "$NATIVE_CAPTURE"
          file "$NATIVE_CAPTURE"

      - name: Download the reference recording
        run: |
          set -euo pipefail
          V=/tmp/reference.mp4
          rm -f "$V" /tmp/page.html /tmp/cj
          echo "--- try gdown ---"
          python3 -m gdown --id "$DRIVE_ID" --fuzzy -O "$V" || true
          if [ ! -s "$V" ] || [ "$(stat -c%s "$V" 2>/dev/null || echo 0)" -lt 300000000 ]; then
            echo "--- gdown did not produce the full file, using Drive confirm flow ---"
            rm -f "$V"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.google.com/uc?export=download&id=$DRIVE_ID" -o /tmp/page.html || true
            TOKEN=$(python3 - <<'PY'
          import re
          s = open('/tmp/page.html', errors='ignore').read()
          m = re.search(r'name="confirm"\s+value="([^"]+)"', s)
          print(m.group(1) if m else 't')
          PY
            )
            UUID=$(python3 - <<'PY'
          import re
          s = open('/tmp/page.html', errors='ignore').read()
          m = re.search(r'name="uuid"\s+value="([^"]+)"', s)
          print(m.group(1) if m else '')
          PY
            )
            echo "confirm=$TOKEN uuid=$UUID"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=$TOKEN&uuid=$UUID" \
              -o "$V" || true
          fi
          if [ ! -s "$V" ] || [ "$(stat -c%s "$V" 2>/dev/null || echo 0)" -lt 300000000 ]; then
            echo "--- last fallback: direct usercontent with confirm=t ---"
            rm -f "$V"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t" \
              -o "$V" || true
          fi
          SIZE=$(stat -c%s "$V" 2>/dev/null || echo 0)
          echo "Downloaded $SIZE bytes (expected 301626146)"
          file "$V" || true
          if [ "$SIZE" -lt 300000000 ]; then
            echo "::error::Could not obtain the full recording ($SIZE bytes)"
            head -c 600 "$V" 2>/dev/null || true
            head -c 600 /tmp/page.html 2>/dev/null || true
            exit 1
          fi

      - name: Probe and extract the storyboard
        run: |
          set -euo pipefail
          OUT="$STORYBOARD_OUT"
          mkdir -p "$OUT/sheets" "$OUT/timeline-sheets" "$OUT/key-states"
          : > /tmp/storyboard.log
          log() { echo "$@" | tee -a /tmp/storyboard.log; }

          log "== probe =="
          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate,nb_frames \
            -of json /tmp/reference.mp4 > "$OUT/probe.json" 2> >(tee -a /tmp/storyboard.log >&2)

          log "== state sheets: 1 fps, 5x4 =="
          ffmpeg -hide_banner -loglevel error -y -i /tmp/reference.mp4 \
            -vf "fps=1,scale=240:-2,tile=5x4:padding=4:margin=4:color=0x121214" \
            -q:v 3 "$OUT/sheets/sheet-%03d.jpg" 2>&1 | tee -a /tmp/storyboard.log

          log "== timeline sheets: 1 fps, 10x8 =="
          ffmpeg -hide_banner -loglevel error -y -i /tmp/reference.mp4 \
            -vf "fps=1,scale=120:266,tile=10x8:padding=2:margin=2:color=0x121214" \
            -q:v 5 "$OUT/timeline-sheets/tl-%03d.jpg" 2>&1 | tee -a /tmp/storyboard.log

          log "== key stills =="
          IFS=',' read -ra TIMES <<< "$KEY_TIMES"
          for t in "${TIMES[@]}"; do
            t="${t// /}"
            [ -n "$t" ] || continue
            name=$(printf 'key-%06.1fs.jpg' "$t")
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i /tmp/reference.mp4 \
              -frames:v 1 -vf "scale=610:-2" -q:v 3 "$OUT/key-states/$name" \
              2>&1 | tee -a /tmp/storyboard.log
            log "extracted $name at ${t}s"
          done

          log "== manifest =="
          python3 - <<'PY' 2>&1 | tee -a /tmp/storyboard.log
          import json, os, pathlib
          out = pathlib.Path(os.environ["STORYBOARD_OUT"])
          probe = json.loads((out / "probe.json").read_text()) if (out / "probe.json").exists() else {}
          sheets = sorted((out / "sheets").glob("sheet-*.jpg"))
          tl = sorted((out / "timeline-sheets").glob("tl-*.jpg"))
          keys = sorted((out / "key-states").glob("key-*.jpg"))
          times = [x.strip() for x in os.environ.get("KEY_TIMES", "").split(",") if x.strip()]
          data = {
              "source": "Screenrecorder-2026-11-04-20-36-00-405.mp4",
              "drive_id": os.environ.get("DRIVE_ID", ""),
              "probe": probe,
              "state_sheets": len(sheets),
              "timeline_sheets": len(tl),
              "key_times": times,
              "key_stills": [p.name for p in keys],
          }
          (out / "manifest.json").write_text(json.dumps(data, indent=2) + "\n")
          (out / "INDEX.md").write_text(
              "# Reference recording storyboard\n\n"
              f"- **{len(sheets)}** labelled state contact sheets in `sheets/` "
              "(1 fps, 5x4 tiles). Read these first, in order.\n"
              f"- **{len(tl)}** timeline contact sheets in `timeline-sheets/` "
              "(1 fps, 10x8 tiles) for animation timing.\n"
              f"- **{len(keys)}** readable stills in `key-states/` at the "
              "screen timestamps listed in `docs/VIDEO_AUDIT.md`.\n"
              "- `probe.json` holds the source video's ffprobe metadata; "
              "`manifest.json` records the extraction settings.\n\n"
              "The Android status strip and gesture pill are present in the "
              "frames but are excluded from the change-detection audit in "
              "`docs/VIDEO_AUDIT.md`. The raw 301,626,146-byte MP4 is NOT in "
              "the repository.\n"
          )
          print(f"wrote manifest: {len(sheets)} state sheets, {len(tl)} timeline sheets, {len(keys)} key stills")
          PY

          log "== summary =="
          du -sh "$OUT" | tee -a /tmp/storyboard.log
          find "$OUT" -type f | wc -l | tee -a /tmp/storyboard.log
          ls -lh "$OUT/sheets" | head -8 | tee -a /tmp/storyboard.log
          ls -lh "$OUT/key-states" | head -12 | tee -a /tmp/storyboard.log

      - name: Save storyboard failure log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `ci-logs/reference-storyboard-${context.runId}.txt`;
            const text = fs.existsSync('/tmp/storyboard.log')
              ? fs.readFileSync('/tmp/storyboard.log', 'utf8')
              : 'No storyboard log was produced.';
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `ci: capture storyboard failure ${context.runId} [skip ci]`,
              content: Buffer.from(text).toString('base64'),
              branch: process.env.BRANCH,
            });

      - name: Commit visual evidence to this branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$NATIVE_CAPTURE" "$STORYBOARD_OUT"
          git commit -m "docs(evidence): import native capture and reference storyboard [skip ci]" || echo "no changes"
          pushed=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$BRANCH"; then pushed=1; break; fi
            echo "push attempt $attempt failed; refreshing"
            sleep 8
            git fetch origin "$BRANCH"
            git pull origin "$BRANCH" --no-rebase || true
          done
          [ "$pushed" = "1" ]
