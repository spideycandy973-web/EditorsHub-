name: Extract reference recording storyboard

# The 10:29.66 / 301,626,146-byte screen recording in Google Drive is larger
# than the agent workspace's 100 MiB per-file transfer limit. GitHub Actions has
# full network access, so it downloads the recording from the public Drive link,
# turns it into compact frames/storyboards, and commits ONLY those small files
# back to this branch. The raw MP4 never enters the repository.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/e30aca1f-editorshub
    paths:
      - '.github/workflows/reference-frames.yml'
      - 'tools/build-storyboard.py'
      - 'tools/reference-frames-trigger.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow gdown
          ffmpeg -version | head -1

      - name: Download the reference recording
        env:
          DRIVE_ID: 1Wqk73fNhe1NqiwwlQC53fjLgZZXtTzq6
        run: |
          set -euo pipefail
          V=/tmp/reference.mp4
          rm -f "$V" /tmp/page.html /tmp/cj
          echo "--- try gdown ---"
          python3 -m gdown --id "$DRIVE_ID" -O "$V" || true
          if [ ! -s "$V" ] || [ "$(stat -c%s "$V")" -lt 300000000 ]; then
            echo "--- gdown did not produce the full file, trying Drive confirm flow ---"
            rm -f "$V"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.google.com/uc?export=download&id=$DRIVE_ID" -o /tmp/page.html || true
            TOKEN=$(python3 - <<'PY'
          import re
          s = open('/tmp/page.html', errors='ignore').read()
          m = re.search(r'name="confirm"\s+value="([^"]+)"', s)
          print(m.group(1) if m else 't')
          PY
            )
            UUID=$(python3 - <<'PY'
          import re
          s = open('/tmp/page.html', errors='ignore').read()
          m = re.search(r'name="uuid"\s+value="([^"]+)"', s)
          print(m.group(1) if m else '')
          PY
            )
            echo "confirm=$TOKEN uuid=$UUID"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=$TOKEN&uuid=$UUID" \
              -o "$V" || true
          fi
          if [ ! -s "$V" ] || [ "$(stat -c%s "$V")" -lt 300000000 ]; then
            echo "--- last fallback: uc endpoint with confirm ---"
            rm -f "$V"
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.google.com/uc?export=download&confirm=t&id=$DRIVE_ID" -o "$V" || true
          fi
          SIZE=$(stat -c%s "$V" 2>/dev/null || echo 0)
          echo "Downloaded $SIZE bytes (expected 301626146)"
          file "$V" || true
          if [ "$SIZE" -lt 300000000 ]; then
            echo "::error::Could not obtain the full recording ($SIZE bytes)"
            head -c 600 /tmp/page.html || true
            exit 1
          fi

      - name: Probe and extract the storyboard
        run: |
          set -euo pipefail
          mkdir -p analysis
          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate,nb_frames \
            -of json /tmp/reference.mp4 > analysis/probe.json
          python3 tools/build-storyboard.py /tmp/reference.mp4
          echo "--- analysis tree ---"
          du -sh analysis
          find analysis -type f | wc -l
          ls -lh analysis/sheets | head -8

      - name: Commit storyboard to this branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f analysis/
          git commit -m "analysis: every distinct UI state from the reference recording [skip ci]" || echo "no changes"
          pushed=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:arena/e30aca1f-editorshub; then pushed=1; break; fi
            echo "push attempt $attempt failed; refreshing"
            sleep 8
            git fetch origin arena/e30aca1f-editorshub
            git pull origin arena/e30aca1f-editorshub --no-rebase || true
          done
          [ "$pushed" = "1" ]
