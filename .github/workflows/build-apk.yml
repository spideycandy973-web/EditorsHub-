name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/8990b65d-editorshub
    # Narrow trigger so a web/Capacitor rebuild does not race the native CI push.
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci/smoke-capacitor.sh'
      - 'rebuild-capacitor-apk.txt'

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate preinstalled Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK root: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package and inspect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EditorsHub-Motion.apk
          ls -lh EditorsHub-Motion.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging EditorsHub-Motion.apk | head -6; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-Motion-apk
          path: EditorsHub-Motion.apk
          if-no-files-found: error

      # Debug builds are CI artifacts only. Stable version tags are
      # published exclusively by android-release.yml after assembleRelease,
      # signing, unit tests and apksigner verification.

  # Installs and launches the actual Capacitor APK on a real Android image.
  smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: EditorsHub-Motion-apk
          path: .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Launch Capacitor APK smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: sh ci/smoke-capacitor.sh

      - name: Publish smoke diagnostics
        if: failure()
        run: |
          mkdir -p ci-logs
          if [ -f smoke-capacitor-diagnostics.txt ]; then
            cp smoke-capacitor-diagnostics.txt ci-logs/smoke-capacitor-diagnostics.txt
          else
            echo "no diagnostics file was produced" > ci-logs/smoke-capacitor-diagnostics.txt
          fi
