name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a6be4510-editorshub
    paths:
      - '.github/workflows/build-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'android/**'

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package and inspect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EditorsHub-Motion.apk
          ls -lh EditorsHub-Motion.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging EditorsHub-Motion.apk | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-Motion-apk
          path: EditorsHub-Motion.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: EditorsHub Motion — Android APK
          body: |
            Installable debug-signed Android APK for EditorsHub Motion.
            Built from the Capacitor Android wrapper by GitHub Actions.
          files: EditorsHub-Motion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
