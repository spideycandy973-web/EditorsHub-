name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          npx cap init EditorsHub com.editorshub.enhancer --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/EditorsHub-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-Android-APK
          path: release-output/EditorsHub-v1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EditorsHub v1.0.${{ github.run_number }} Android APK Release
          body: |
            ## EditorsHub Android Release (v1.0.${{ github.run_number }})
            Authentic frame-by-frame super-resolution and real pixel enhancement studio.
            
            ### Included Assets:
            - **EditorsHub-v1.0.apk**: Standalone Android Application Package
          files: release-output/EditorsHub-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
