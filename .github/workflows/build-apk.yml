name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android Native Project
        run: npx cap sync android

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/EditorsHub-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-Android-APK
          path: release-output/EditorsHub-v1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EditorsHub v1.0.${{ github.run_number }} - Android APK
          body: |
            ## 🚀 EditorsHub v1.0.${{ github.run_number }} Android Release
            
            Authentic frame-by-frame super-resolution and real pixel enhancement studio powered by advanced neural algorithms.
            
            ### 📱 Download & Install:
            - **[EditorsHub-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/EditorsHub-v1.0.apk)**
            
            ### ✨ Features:
            - Authentic pixel reconstruction (No fake smoothing or plastic filter)
            - Interactive split-view comparison slider (Vertical & Horizontal)
            - Automated Quality Analyzer (noise floor & optical sharpness scoring)
            - 400% Sub-pixel Loupe Inspector
            - Video frame-by-frame super-resolution engine
            - Standalone APK with offline hardware-accelerated processing
          files: release-output/EditorsHub-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

