name: Signed Android release (Motion Studio)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured. Debug keys are not used for releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > MotionStudio/app/release.jks
          cat > MotionStudio/app/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build signed APK + AAB
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          chmod +x MotionStudio/gradlew
          cd MotionStudio
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace
          cd ..
          mkdir -p artifacts
          cp MotionStudio/app/build/outputs/apk/release/app-release.apk artifacts/MotionStudio-release.apk
          cp MotionStudio/app/build/outputs/bundle/release/app-release.aab artifacts/MotionStudio-release.aab
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose artifacts/MotionStudio-release.apk

      - name: Remove decoded key from workspace
        if: always()
        run: rm -f MotionStudio/app/release.jks MotionStudio/app/keystore.properties

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Motion Studio ${{ inputs.version }}
          body: |
            Signed production build of Motion Studio.
            Configure KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets.
          files: |
            artifacts/MotionStudio-release.apk
            artifacts/MotionStudio-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
