name: Signed Android release (EditorsHub)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v4.5.0)'
        required: true
        default: 'v4.6.0'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name secret is not configured. Debug keys are not used for releases."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > EditorsHub/app/release.jks
          printf '%s\n' \
            'storeFile=release.jks' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > EditorsHub/app/keystore.properties

      - name: Build signed APK + AAB
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          chmod +x EditorsHub/gradlew
          cd EditorsHub
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace
          cd ..
          mkdir -p artifacts
          cp EditorsHub/app/build/outputs/apk/release/app-release.apk artifacts/EditorsHub-release.apk
          cp EditorsHub/app/build/outputs/bundle/release/app-release.aab artifacts/EditorsHub-release.aab
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose artifacts/EditorsHub-release.apk

      - name: Remove decoded key from workspace
        if: always()
        run: rm -f EditorsHub/app/release.jks EditorsHub/app/keystore.properties

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: EditorsHub ${{ inputs.version }}
          body: |
            Signed production build of EditorsHub.
            Configure KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets.
          files: |
            artifacts/EditorsHub-release.apk
            artifacts/EditorsHub-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
